<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizar Lúa</title><style>body{font:17px system-ui;background:#f7f5f9;color:#32243e;max-width:480px;margin:15vh auto;padding:24px}button{background:#32243e;color:white;border:0;border-radius:14px;padding:16px;font:inherit}p{line-height:1.6}</style><h1>Actualizar Lúa</h1><p>Renueva los archivos de la aplicación. Conserva el historial guardado en este navegador; no modifica su base de datos.</p><button id="update">Actualizar y abrir Lúa</button><p id="status" role="status"></p><script>
document.getElementById('update').onclick=async()=>{const b=document.getElementById('update'),s=document.getElementById('status');b.disabled=true;s.textContent='Actualizando…';try{const base=new URL('./',location.href).href;for(const r of await navigator.serviceWorker.getRegistrations()){if(r.scope===base)await r.unregister();}for(const k of await caches.keys()){if(k.startsWith('lua-shell-'))await caches.delete(k);}location.replace('./?updated=20261018');}catch(e){s.textContent='No se pudo actualizar: '+e.message;b.disabled=false;}};
</script></html>
